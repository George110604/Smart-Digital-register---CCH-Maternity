<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1b3a"/>
      <stop offset="0.45" stop-color="#14527a"/>
      <stop offset="0.8" stop-color="#1b8a9a"/>
      <stop offset="1" stop-color="#37b3a8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c9c8f"/><stop offset="1" stop-color="#0e6f72"/></linearGradient>
    <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b7fa8"/><stop offset="1" stop-color="#1c5f86"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f5f66"/><stop offset="1" stop-color="#0a3f4d"/></linearGradient>
  </defs>

  <!-- sky and glow -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <circle cx="800" cy="520" r="150" fill="#ffe3b3" opacity="0.28"/>
  <circle cx="800" cy="520" r="95" fill="#fff0cf" opacity="0.35"/>

